<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Red Arch 3D Gradient -->
    <linearGradient id="badgeRedArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="35%" stop-color="#DC2626" />
      <stop offset="85%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Left Kidney 3D Gradient -->
    <linearGradient id="badgeKidneyL" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="25%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="85%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Right Kidney 3D Gradient -->
    <linearGradient id="badgeKidneyR" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="30%" stop-color="#2563EB" />
      <stop offset="65%" stop-color="#1D4ED8" />
      <stop offset="90%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Ureter / Vessel Gradient -->
    <linearGradient id="badgeUreter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Supporting Hand 3D Gradient -->
    <linearGradient id="badgeHand" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="30%" stop-color="#047857" />
      <stop offset="75%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Specular Gloss Highlights -->
    <linearGradient id="badgeGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Cast Drop Shadow for Emblem -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <filter id="badgeTextShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#001F4D" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Clean Base / Framing -->
  <rect width="500" height="500" rx="36" fill="#FFFFFF" />

  <!-- EMBLEM GROUP (Centered in upper area) -->
  <g transform="translate(100, 30) scale(1.5)" filter="url(#badgeShadow)">
    <!-- 1. Tapered Red Protective Arch -->
    <path 
      d="M 32 86 C 39 46 66 23 100 23 C 134 23 161 46 168 86 C 163 83 140 32 100 32 C 60 32 37 83 32 86 Z" 
      fill="url(#badgeRedArch)" 
    />

    <!-- 2. Descending Ureters / Renal Vessels -->
    <!-- Left Ureter -->
    <path 
      d="M 85 82 C 92 90 95 104 96 128" 
      stroke="url(#badgeUreter)" 
      stroke-width="5" 
      stroke-linecap="round" 
    />
    <!-- Right Ureter -->
    <path 
      d="M 115 82 C 108 90 105 104 104 128" 
      stroke="url(#badgeUreter)" 
      stroke-width="5" 
      stroke-linecap="round" 
    />
    <!-- Vascular connection at hilum -->
    <path 
      d="M 84 81 C 92 78 108 78 116 81" 
      stroke="#2563EB" 
      stroke-width="3.5" 
      stroke-linecap="round" 
    />

    <!-- 3. Left Kidney -->
    <g>
      <path 
        d="M 82 44 C 62 44 48 58 48 80 C 48 102 62 118 78 118 C 86 118 90 110 90 100 C 90 92 84 88 84 82 C 84 76 90 70 90 58 C 90 48 88 44 82 44 Z" 
        fill="url(#badgeKidneyL)" 
      />
      <!-- Specular Gloss on lateral crest -->
      <path 
        d="M 58 56 C 52 66 52 86 60 98" 
        stroke="url(#badgeGloss)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
      />
      <!-- Hilum depth contour -->
      <path 
        d="M 76 74 C 73 78 73 86 76 90" 
        stroke="#93C5FD" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.75" 
      />
    </g>

    <!-- 4. Right Kidney -->
    <g>
      <path 
        d="M 118 44 C 138 44 152 58 152 80 C 152 102 138 118 122 118 C 114 118 110 110 110 100 C 110 92 116 88 116 82 C 116 76 110 70 110 58 C 110 48 112 44 118 44 Z" 
        fill="url(#badgeKidneyR)" 
      />
      <!-- Specular Gloss on lateral crest -->
      <path 
        d="M 142 56 C 148 66 148 86 140 98" 
        stroke="url(#badgeGloss)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
      />
      <!-- Hilum depth contour -->
      <path 
        d="M 124 74 C 127 78 127 86 124 90" 
        stroke="#93C5FD" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.75" 
      />
    </g>

    <!-- 5. Caring Human Hand in Emerald Green Cradling the Kidneys -->
    <g>
      <!-- Main Palm and Wrist Volume -->
      <path 
        d="M 36 142 C 45 135 56 128 66 125 C 74 122 82 121 88 123 C 86 126 80 129 74 131 C 84 131 94 133 102 134 C 116 135 130 131 142 124 C 148 120 154 115 156 112 C 158 114 156 120 152 126 C 146 134 135 142 120 148 C 102 154 78 155 58 150 C 48 147 40 144 36 142 Z" 
        fill="url(#badgeHand)" 
      />

      <!-- Fingers Separation / Creases & Highlights -->
      <path 
        d="M 98 134 C 114 135 130 131 144 123 C 150 119 155 114 156 112" 
        stroke="#6EE7B7" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.85" 
      />
      <path 
        d="M 64 126 C 72 122 80 122 86 124" 
        stroke="#A7F3D0" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        opacity="0.8" 
      />
      <path 
        d="M 124 136 L 138 126" 
        stroke="#047857" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        opacity="0.7" 
      />
      <path 
        d="M 134 140 L 146 128" 
        stroke="#047857" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        opacity="0.7" 
      />
    </g>
  </g>

  <!-- 3D EMBOSSED TYPOGRAPHY MATCHING USER'S PHOTO -->
  <g transform="translate(250, 368)" text-anchor="middle" filter="url(#badgeTextShadow)">
    <text 
      x="0" 
      y="0" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
      font-weight="900" 
      font-size="44" 
      letter-spacing="2"
    >
      <tspan fill="#0F3875">RENAL </tspan>
      <tspan fill="#047857">MEDICARE</tspan>
    </text>

    <!-- Subtitle: KIDNEY CARE & DIALYSIS CENTER -->
    <text 
      x="0" 
      y="38" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
      font-weight="800" 
      font-size="17" 
      fill="#0F2F64" 
      letter-spacing="4.8"
    >KIDNEY CARE &amp; DIALYSIS CENTER</text>
  </g>
</svg>
